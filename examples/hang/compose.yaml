# Every request on the data port is accepted and never answered; the process stays up
# and Docker marks it unhealthy. The control listener still works:
#   docker compose exec bop bop healthy
services:
  bop:
    image: ${BOP_IMAGE:-ghcr.io/jackspiering/bop:edge}
    environment:
      BOP_MODE: "hang"
    ports:
      - "8080:8080"
    healthcheck:
      # Same as the image's own check, with timings short enough to watch.
      test: ["CMD", "/bop", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 2
