# Sticky modes live in the container's writable layer.
#   docker compose exec bop bop unhealthy sticky=true
#   docker compose restart bop        # still unhealthy: same writable layer
#   docker compose up -d --force-recreate bop   # healthy again: new layer
# A sticky mode lasts exactly as long as $BOP_STATE_DIR (default /tmp/bop).
# With read_only: true and no writable mount there, bop reports the write
# failure. Adding tmpfs: [/tmp] makes the write succeed, but the tmpfs is
# emptied on every restart, so the mode is lost; a volume survives recreates.
services:
  bop:
    image: ${BOP_IMAGE:-ghcr.io/jackspiering/bop:edge}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/bop", "healthcheck"]
      interval: 2s
      timeout: 2s
      # 1ms, not 0s: Docker reads 0s as unset and inherits the image's 10s.
      start_period: 1ms
      retries: 2
