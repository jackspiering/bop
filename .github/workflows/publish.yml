name: Publish

# main publishes :edge and :sha-<short>. A vX.Y.Z tag publishes :X.Y.Z, :X.Y
# and :latest; a vX.Y.Z-PRERELEASE tag publishes only :X.Y.Z-PRERELEASE. Both
# then create the GitHub Release. Any other tag fails before anything is pushed.
# :latest, :X.Y and :edge only move forward: an older tag or a re-run of an
# older commit leaves them where they are.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jackspiering/bop
  # Strict SemVer with an optional pre-release and no +build metadata. The
  # trigger above is broader on purpose, so a mistyped tag shows up as a red
  # run instead of no run. test/release checks this regex.
  TAG_RE: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build, push and sign
    needs: ci
    # Belt and braces: the trigger already limits this to main and release tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - name: Require a vMAJOR.MINOR.PATCH[-PRERELEASE] tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! [[ $GITHUB_REF_NAME =~ $TAG_RE ]]; then
            echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]; refusing to publish"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag check below needs main's history
      - name: Require release tags to point at main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; refusing to publish a release from another branch"
            exit 1
          fi
      - name: Decide which moving tags this run may update
        id: channels
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch --force --tags origin # include tags pushed after checkout
          else
            git fetch --no-tags origin main
          fi
          .github/scripts/moving-tags.sh | tee -a "$GITHUB_OUTPUT"
      # Pinned by hand: Dependabot does not track driver-opts images. Keep the
      # same reference in ci.yml and publish.yml (test/release checks it).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :X.Y.Z is immutable. A first attempt on an existing version (a deleted
      # and re-pushed tag) fails before anything is pushed. A re-run reuses the
      # existing digest instead of rebuilding, so the tags keep their digest.
      - name: Do not rebuild an existing release
        id: existing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ref="${IMAGE}:${GITHUB_REF_NAME#v}"
          if out="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1)"; then
            if ! [[ $out =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::cannot read the digest of $ref: $out"
              exit 1
            fi
            if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
              echo "::error::$ref already exists ($out); release tags are immutable, cut a new version"
              exit 1
            fi
            echo "::notice::$ref already exists; re-signing and re-tagging $out instead of rebuilding"
            echo "digest=$out" >> "$GITHUB_OUTPUT"
          elif ! printf '%s\n' "$out" | grep -qF "$ref: not found"; then
            echo "::error::cannot check $ref: $out"
            exit 1
          fi
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # The default latest=auto would add :latest to every stable tag;
          # the channels step decides it instead.
          flavor: latest=false
          tags: |
            type=edge,branch=main,enable=${{ steps.channels.outputs.edge == 'true' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.channels.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.channels.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=bop
            org.opencontainers.image.description=Deliberately failing test image. Not for production.
            org.opencontainers.image.licenses=MIT
      # The commit's main run already pushed :sha-<short>; a release build of
      # the same commit has a different VERSION and so a different digest.
      - name: Release tags must not re-push :sha-<short>
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if printf '%s\n' "$TAGS" | grep -q ':sha-'; then
            echo "::error::release builds must not push :sha-<short>"
            exit 1
          fi
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      # Push by digest only. No public tag moves until the digest is signed and
      # verified ("Tag the verified digest" below).
      - name: Build and push
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          # Pinned by hand: Dependabot does not track the SBOM generator.
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the digest
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # Run the README's strict verify command on every publish, so a change
      # to the workflow name or triggers cannot silently break it.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github\.com/jackspiering/bop/\.github/workflows/publish\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # The tags come in through env, never inline ${{ }}: the tag trigger
      # glob allows arbitrary suffixes.
      - name: Tag the verified digest
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$tag resolves to $got, not $DIGEST"
              exit 1
            fi
            echo "$tag -> $got"
          done <<< "$TAGS"

  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists (re-run); leaving it as is"
            exit 0
          fi
          image_ref="${IMAGE}:${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes $prerelease \
            --notes "Image: \`${image_ref}\` (linux/amd64, linux/arm64), signed with keyless cosign; see the README for \`cosign verify\`."
